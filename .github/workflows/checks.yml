name: WAN_SIM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  l3-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bash syntax
        run: bash -n WANsim2.sh
      - name: L3 access and VLAN regression tests
        run: python -m unittest discover -s tests -v
      - name: Install WAN_SIM 2.0 backend checks
        run: python -m pip install -r v2/backend/requirements.txt
      - name: WAN_SIM 2.0 API transaction tests
        run: PYTHONPATH=v2/backend python -m unittest discover -s v2/backend/tests -v
      - name: Validate V2 integration harness
        run: python -m py_compile v2/integration/host_apply.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build ReactUI 2.0
        working-directory: v2/frontend
        run: |
          npm install --no-package-lock
          npm run build
      - name: Validate Docker Compose definition
        env:
          WANSIM_V2_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          WANSIM_V2_API_KEY: test-compose-api-key-1234567890
        run: docker compose -f v2/deploy/docker-compose.yml config --quiet
      - name: Browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/wansim-ui" --no-save --package-lock=false playwright@1.58.2
          "$RUNNER_TEMP/wansim-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: ReactUI controls and submit
        run: NODE_PATH="$RUNNER_TEMP/wansim-ui/node_modules" node tests/check_reactui.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reactui-screenshots
          path: test-results/
