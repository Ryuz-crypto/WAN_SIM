name: WAN_SIM release packages

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install package toolchains
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build DEB and RPM
        run: bash packaging/build-packages.sh
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: wansim-${{ github.ref_name }}-packages
          path: dist/
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
