name: WAN_SIM Vagrant acceptance matrix

on:
  push:
    branches: [main]
    tags: ["v2.*-stable"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vagrant:
    name: ${{ matrix.machine }} VM acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        machine: [ubuntu, debian, fedora, rocky]
    steps:
      - uses: actions/checkout@v5
      - name: Install Vagrant
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gpg
          curl --fail --silent --show-error https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com ${UBUNTU_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant
          vagrant version
      - name: Run installation lifecycle in VM
        working-directory: v2/integration
        env:
          VAGRANT_PROVIDER: docker
        run: vagrant up ${{ matrix.machine }} --provider=docker --provision
      - name: Verify SSH management remains available
        working-directory: v2/integration
        env:
          VAGRANT_PROVIDER: docker
        run: vagrant ssh ${{ matrix.machine }} -c "test -f /vagrant/test-results/vagrant/*/installer-lifecycle.log"
      - name: Collect acceptance evidence
        if: always()
        run: |
          mkdir -p "test-results/vagrant-${{ matrix.machine }}"
          cp -a test-results/vagrant/. "test-results/vagrant-${{ matrix.machine }}/" 2>/dev/null || true
          vagrant -v > "test-results/vagrant-${{ matrix.machine }}/versions.txt"
          docker version --format '{{.Server.Version}}' >> "test-results/vagrant-${{ matrix.machine }}/versions.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vagrant-${{ matrix.machine }}
          path: test-results/vagrant-${{ matrix.machine }}/
      - name: Destroy VM
        if: always()
        working-directory: v2/integration
        env:
          VAGRANT_PROVIDER: docker
        run: vagrant destroy -f ${{ matrix.machine }}
