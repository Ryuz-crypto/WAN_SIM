services:
  api:
    build:
      context: ../backend
    environment:
      WANSIM_V2_DATA_DIR: /data
      WANSIM_V2_EXECUTION_MODE: dry-run
      WANSIM_V2_SECRET_KEY: ${WANSIM_V2_SECRET_KEY:?Set a Fernet key before starting Compose}
      WANSIM_V2_API_KEY: ${WANSIM_V2_API_KEY:?Set an operator API key before starting Compose}
    volumes:
      - wansim_state:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  reactui:
    build:
      context: ../frontend
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      reactui:
        condition: service_started
    ports:
      - "${WANSIM_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  wansim_state:
